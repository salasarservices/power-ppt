[project]
name = "power-ppt-api"
version = "0.1.0"
description = "PowerPPT brand engine + API — reformats decks into the Salasar template"
requires-python = ">=3.11"

# Core deps for the brand engine (stack-agnostic — no web framework here).
dependencies = [
    "python-pptx==1.0.2",
    "Pillow>=11.1,<13",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
# OCR path (used by the /analyze endpoint in Phase 2, not by the engine).
ocr = [
    "opencv-python-headless>=4.9,<5",
    "numpy>=1.26,<3",
    "google-cloud-vision>=3.7,<4",
    "google-cloud-documentai>=2.20,<4",
    "pytesseract>=0.3.10,<0.4",
    "boto3>=1.34,<2",
]
# API layer (Phase 2).
api = [
    "fastapi>=0.115,<0.117",
    "uvicorn[standard]>=0.30,<0.35",
    "pydantic-settings>=2.3,<3",
    "python-multipart>=0.0.9,<0.1",
]
# Tier-2 AI extraction (render + Vertex AI Gemini). LibreOffice (soffice) is a
# system dependency (installed in the image), not a Python package.
ai = [
    "google-genai>=1.0,<2",
    "pymupdf>=1.24,<2",
]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<0.29",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
